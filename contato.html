<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contato</title>

<link rel="stylesheet" href="css/styles.css">
 <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>
<section class="contact-section">
    <div class="contact-info">
        <h2>Vamos conversar?</h2>
        <p>Tem alguma dúvida sobre como implementar a Tutoria de Pares na sua escola, deseja dar um feedback ou compartilhar uma experiência de sucesso conosco? Ficaremos radiantes em receber sua mensagem!</p>
        <div class="journey-header-badge">Retorno rápido e acolhedor</div>
    </div>

    <div>
        <form class="magic-form" action="#" method="POST" onsubmit="event.preventDefault(); alert('Mensagem enviada com magia! ✨');">
            <div class="form-group">
                <label for="name">Seu Nome Lindo</label>
                <input type="text" id="name" placeholder="Como quer que te chamemos?" required>
            </div>

            <div class="form-group">
                <label for="email">Seu E-mail</label>
                <input type="email" id="email" placeholder="exemplo@email.com" required>
            </div>

            <div class="form-group">
                <label for="message">Sua Mensagem / Relato</label>
                <textarea id="message" rows="5" placeholder="Escreva aqui seu coração ou suas dúvidas..." required></textarea>
            </div>

            <button type="submit" class="btn-magic">Enviar com Magia </button>
        </form>
    </div>
</section>

</body>
</html>
